[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentdojo-safety-approval-policies"
version = "0.1.0"
description = "Approval gates and policies evaluated with AgentDojo"
requires-python = ">=3.10"
dependencies = ["agentdojo==0.1.35", "openai>=1.59.7"]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
include = ["approval_policies*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
